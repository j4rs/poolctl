# Builds the public site: a landing page, the panel plan, and a live demo of
# the controller itself.
#
# The demo is why this is a build rather than a directory upload. A production
# bundle normally assumes the supervisor is serving it, so on a static host it
# would wait forever for a socket that cannot open. `VITE_MOCK=1` forces the
# mock transport, and the app's own MOCK DATA badge then tells the truth about
# what the numbers are.
#
# Two paths that must agree and are easy to break: `--base` has to match where
# the bundle is served from, and it differs from the supervisor's own build,
# which serves at the root. So it is set here and never in package.json.
#
# .nojekyll is written at build time rather than committed: Jekyll would
# otherwise try to process the page and the three .py generators, and nothing
# here wants a static-site generator's opinion.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/panel/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the figures are stale against plate.py
        run: python3 docs/panel/check.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            supervisor/package-lock.json

      - run: npm ci

      # The supervisor is a separate package with its own dependencies, and
      # index.test.js spawns it as a real process. Without this the spawn dies
      # on socket.io-client and every integration suite fails at once — which
      # is how the first run of this workflow discovered that the suite had
      # never been run on a clean checkout.
      - run: npm ci --prefix supervisor

      # The supervisor serves dist/, and auth.integration.test.js asserts that
      # it does — so the app has to be built before the suite runs, not only
      # before the deploy. This is the second thing the first CI run found
      # that a working copy had been quietly supplying.
      - run: npm run build

      # The suite gates the deploy. A demo of a controller whose own tests are
      # failing is worse than no demo.
      - run: npm test

      - name: Assemble the site
        env:
          VITE_MOCK: '1'
        run: |
          mkdir -p _site
          cp docs/site/index.html _site/index.html
          cp -r docs/panel _site/panel
          npx vite build --base=/poolctl/app/ --outDir _site/app --emptyOutDir
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
